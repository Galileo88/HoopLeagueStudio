name: Fix Getting Started layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-layout.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Getting Started layout and branding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_label = 'HOOPLAND LEAGUE STUDIO'
          count = text.count(old_label)
          if count < 1:
              raise SystemExit(f'Expected at least one {old_label!r} label, found {count}')
          text = text.replace(old_label, 'HOOP LEAGUE STUDIO')
          print(f'Updated {count} branding label(s).')

          style_id = 'home-layout-fix'
          if f'id="{style_id}"' in text:
              raise SystemExit('Home layout fix style already exists; refusing to duplicate it.')

          css = '''
<style id="home-layout-fix">
/* Finished-home layout: full-width intro, two equal workspace cards on desktop. */
@media (min-width:1001px){
  body.workspace-home main{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    align-content:start;
  }
  body.workspace-home main>#pageNav,
  body.workspace-home main>.heading,
  body.workspace-home main>.card:first-of-type{
    grid-column:1/-1;
  }
  body.workspace-home main>.card{
    width:100%;
    max-width:none;
    margin:0;
    min-width:0;
  }
}
</style>
'''

          marker = '</head>'
          if marker not in text:
              raise SystemExit('Could not find </head> in index.html')
          text = text.replace(marker, css + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate index scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No script blocks found in index.html')
          with tempfile.TemporaryDirectory() as tmp:
              for i, script in enumerate(scripts, 1):
                  p = Path(tmp) / f'script-{i}.js'
                  p.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          print(f'Validated {len(scripts)} script block(s).')
          PY

      - name: Commit finished layout
        run: |
          rm -f .github/workflows/fix-home-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Polish Getting Started layout'
          git push origin HEAD:main
